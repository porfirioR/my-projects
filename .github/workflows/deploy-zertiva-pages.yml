name: Deploy Zertiva (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'zertiva/**'
      - '.github/workflows/deploy-zertiva-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy de Pages a la vez para este repo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Solo se empaqueta la carpeta zertiva/: el resto del monorepo
      # (password-generator, registro-unico-contribuyente, etc.) nunca
      # forma parte del artifact publicado.
      - name: Upload zertiva/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zertiva

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
